name: Deploy Vue App to GitHub Pages

on:
  push:
    branches:
      - master  # Change to 'main' if your default branch is main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'  # Use Node 18 for better compatibility
          cache: 'npm'
          cache-dependency-path: 'frontend/frontend/package-lock.json'
          
      - name: Install dependencies and build Vue app
        run: |
          cd frontend/frontend
          npm ci  # Use npm ci for faster, reliable installs
          npm run build
          
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: frontend/frontend/dist  # Path to built Vue files
          clean: true  # Remove old files before deploying
          single-commit: true  # Create single commit for better performance
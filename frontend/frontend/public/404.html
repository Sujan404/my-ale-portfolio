<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ale Sujan Portfolio</title>
    
    <!-- Single Page Apps for GitHub Pages -->
    <!-- This script checks to see if a redirect is present in the query string -->
    <!-- and converts it back into the correct url and adds it to the browser's history -->
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
</head>
<body>
    <div id="app"></div>
    <!-- These will be populated by the build process - copy from your built index.html -->
    <!-- The actual script tags will be added here after build -->
</body>
</html>
